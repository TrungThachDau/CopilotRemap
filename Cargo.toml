[package]
name = "copilot_remap"
version = "1.0.0"
edition = "2024"
authors = ["CopilotRemap Developer"]
description = "Ultra-fast Copilot Key Remapper for Windows 11 written in Rust"

[lib]
name = "copilot_remap"
path = "src/lib.rs"

[[bin]]
name = "CopilotRemap"
path = "src/main.rs"

[[bin]]
name = "Settings"
path = "src/bin/settings.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.60.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
